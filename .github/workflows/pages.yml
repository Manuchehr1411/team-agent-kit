name: Публикация сайта GitHub Pages

# Публикация запускается владельцем вручную после проверки текстов.
"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Получить исходники
        uses: actions/checkout@v6
      - name: Собрать проверенный сайт
        run: python3 scripts/build_website.py
      - name: Проверить страницы и ссылки
        run: python3 checks/validate_website.py
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5
      - name: Загрузить только файлы сайта
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/website
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
